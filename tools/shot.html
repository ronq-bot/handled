<!doctype html>
<html>
<!-- Store-screenshot frame: a caption band above the game running in an iframe.
     Driven by scripts/make-screenshots.cjs. -->
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #5a1fc0; }
  #cap { height: 15%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(#9b4cff, #5a1fc0); border-bottom: 6px solid #1d1033; box-sizing: border-box;
    font-family: 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif; font-weight: 900; color: #fff; text-align: center; }
  #t { font-size: min(10vw, 80px); line-height: 1.05; -webkit-text-stroke: 2px #1d1033; text-shadow: 0 5px 0 #1d1033; }
  #s { font-size: min(5vw, 38px); color: #ffe066; margin-top: 6px; text-shadow: 0 3px 0 #1d1033; }
  iframe { display: block; border: 0; width: 100%; height: 85%; }
</style>
</head>
<body>
  <div id="cap"><div id="t"></div><div id="s"></div></div>
  <iframe id="game" src="../index.html"></iframe>
  <script>
    window.setCaption = (t, s) => {
      document.getElementById('t').textContent = t;
      document.getElementById('s').textContent = s;
    };
  </script>
</body>
</html>
